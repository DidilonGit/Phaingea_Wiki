name: Deploy Phaingea a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Si algo se queda colgado, que falle pronto y se vea, en vez de estar
    # quince minutos y acabar cancelado sin explicacion.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar, construir y subir
        uses: withastro/action@v3
        with:
          node-version: 22 # Astro 7 requiere Node >= 22.12
        env:
          PUBLIC_APP_VERSION: ${{ github.sha }} # versión = commit; alimenta la auto-recarga
        # withastro/action ejecuta npm ci + astro build y sube el artefacto de Pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
